services:
  eedu-docs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://docs.eedu.bd}
        PORT: ${PORT:-3007}
    image: ${DOCS_IMAGE:-eedu-docs:latest}

    environment:
      NODE_ENV: production
      PORT: "${PORT:-3007}"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://docs.eedu.bd}
      NEXT_TELEMETRY_DISABLED: "1"

    expose:
      - "${PORT:-3007}"

    restart: unless-stopped
    init: true

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${PORT:-3007}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
        reservations:
          cpus: "0.10"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - proxy
      - eedu-internal

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Main Domain (docs.eedu.bd)
      - "traefik.http.routers.eedu-docs.rule=Host(`docs.eedu.bd`)"
      - "traefik.http.routers.eedu-docs.entrypoints=websecure"
      - "traefik.http.routers.eedu-docs.tls=true"
      - "traefik.http.routers.eedu-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eedu-docs.service=eedu-docs-svc"
      - "traefik.http.routers.eedu-docs.middlewares=eedu-docs-ratelimit@docker,eedu-docs-retry@docker"

      # Service + active health check
      - "traefik.http.services.eedu-docs-svc.loadbalancer.server.port=${PORT:-3007}"
      - "traefik.http.services.eedu-docs-svc.loadbalancer.passhostheader=true"
      - "traefik.http.services.eedu-docs-svc.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.eedu-docs-svc.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.eedu-docs-svc.loadbalancer.healthcheck.timeout=5s"

      # Edge rate limit
      - "traefik.http.middlewares.eedu-docs-ratelimit.ratelimit.average=600"
      - "traefik.http.middlewares.eedu-docs-ratelimit.ratelimit.burst=200"
      - "traefik.http.middlewares.eedu-docs-ratelimit.ratelimit.period=1m"

      # Transient-failure retry with backoff
      - "traefik.http.middlewares.eedu-docs-retry.retry.attempts=2"
      - "traefik.http.middlewares.eedu-docs-retry.retry.initialinterval=100ms"

networks:
  proxy:
    external: true
  eedu-internal:
    external: true