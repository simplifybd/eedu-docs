name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SITE_URL: https://docs.eedu.bd

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Lint is non-blocking: this template ships a TS 7.0.2 toolchain that
      # typescript-eslint does not support yet. `pnpm types:check` is the gate.
      - name: Lint gate (best effort)
        continue-on-error: true
        run: pnpm lint --max-warnings=0

      - name: Type-check gate
        run: pnpm types:check

      - name: Build gate (next build)
        run: pnpm build