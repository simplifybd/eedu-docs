<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Domain verification flow from registrar DNS records to a live site with SSL">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <g font-family="system-ui,Segoe UI,Roboto,sans-serif">
    <!-- Step 1 -->
    <rect x="30" y="95" width="190" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="125" cy="130" r="18" fill="#0b72b5" opacity="0.15" stroke="#0b72b5"/>
    <text x="125" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#0b72b5">1</text>
    <text x="125" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Add domain</text>
    <text x="125" y="192" text-anchor="middle" font-size="12.5" fill="#475569">in eEdu</text>

    <!-- Step 2 -->
    <rect x="260" y="95" width="190" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="355" cy="130" r="18" fill="#0b72b5" opacity="0.15" stroke="#0b72b5"/>
    <text x="355" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#0b72b5">2</text>
    <text x="355" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Add DNS records</text>
    <text x="355" y="192" text-anchor="middle" font-size="12.5" fill="#475569">CNAME + TXT</text>

    <!-- Step 3 -->
    <rect x="490" y="95" width="190" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="585" cy="130" r="18" fill="#0b72b5" opacity="0.15" stroke="#0b72b5"/>
    <text x="585" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#0b72b5">3</text>
    <text x="585" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">eEdu verifies</text>
    <text x="585" y="192" text-anchor="middle" font-size="12.5" fill="#475569">every hour + on demand</text>

    <!-- Step 4 -->
    <rect x="720" y="95" width="210" height="110" rx="14" fill="#41a62a" opacity="0.08" stroke="#41a62a" stroke-width="2"/>
    <circle cx="825" cy="130" r="18" fill="#41a62a" opacity="0.18" stroke="#41a62a"/>
    <text x="825" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#41a62a">4</text>
    <text x="825" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Free SSL issued</text>
    <text x="825" y="192" text-anchor="middle" font-size="12.5" fill="#475569">www.yourschool.edu.bd</text>

    <!-- arrows -->
    <line x1="222" y1="150" x2="258" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="452" y1="150" x2="488" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="682" y1="150" x2="718" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

    <text x="480" y="262" text-anchor="middle" font-size="13" fill="#64748b">Keep the TXT records after launch — they renew your certificate automatically.</text>
  </g>
</svg>
