<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Attendance device sending punches to eEdu over HTTPS">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <g font-family="system-ui,Segoe UI,Roboto,sans-serif">
    <!-- Device -->
    <rect x="40" y="95" width="200" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="120" y="120" width="40" height="46" rx="8" fill="#0b72b5" opacity="0.15" stroke="#0b72b5"/>
    <circle cx="140" cy="138" r="9" fill="none" stroke="#0b72b5" stroke-width="2.5"/>
    <path d="M132 148 q8 8 16 0" fill="none" stroke="#0b72b5" stroke-width="2.5"/>
    <text x="140" y="188" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Biometric / RFID</text>
    <text x="140" y="206" text-anchor="middle" font-size="13" fill="#475569">device</text>

    <!-- Router -->
    <rect x="380" y="110" width="200" height="80" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="440" y="132" width="80" height="34" rx="8" fill="#0b72b5" opacity="0.15" stroke="#0b72b5"/>
    <text x="480" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#0b72b5">Router</text>
    <text x="480" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">School network</text>

    <!-- Cloud / eEdu -->
    <rect x="720" y="95" width="200" height="110" rx="14" fill="#0b72b5" opacity="0.08" stroke="#0b72b5" stroke-width="2"/>
    <text x="820" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0b72b5">eEdu</text>
    <text x="820" y="164" text-anchor="middle" font-size="13" fill="#475569">cloud server</text>
    <text x="820" y="184" text-anchor="middle" font-size="12" fill="#475569">Asia/Dhaka clock</text>

    <!-- arrows -->
    <line x1="245" y1="140" x2="375" y2="140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="310" y="128" text-anchor="middle" font-size="12.5" fill="#475569">HTTPS 443</text>

    <line x1="585" y1="140" x2="715" y2="140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="650" y="128" text-anchor="middle" font-size="12.5" fill="#475569">push punch</text>

    <line x1="715" y1="172" x2="585" y2="172" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="650" y="196" text-anchor="middle" font-size="12.5" fill="#475569">records</text>

    <text x="480" y="262" text-anchor="middle" font-size="13" fill="#64748b">No public IP, port-forwarding or static IP needed — only outbound web traffic.</text>
  </g>
</svg>
